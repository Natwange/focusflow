# Render Blueprint: API only. Create a separate Static Site or Web Service for client/ (Next.js).
# https://render.com/docs/blueprint-spec
#
# Required env vars on the service (Dashboard → Environment):
#   DATABASE_URL, JWT_SECRET, CLIENT_ORIGIN (your live Next.js URL)
# Split frontend/API hostnames → also set COOKIE_SAME_SITE=none
# Behind Render proxy → TRUST_PROXY=1
# Login limits are per-email (not shared IP). Safe defaults need no extra env.
# Remove AUTH_RATE_LIMIT_MAX if set — it only affects reset/verify, but low values confuse debugging.
# Login has no in-app failure rate limit (POST /auth/login never returns 429 for this).
# Optional register/forgot limits: REGISTER_RATE_LIMIT_MAX, FORGOT_PASSWORD_RATE_LIMIT_MAX

services:
  - type: web
    name: focusflow-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
